<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>폭탄 제거 작전! 초등 논리력 퍼즐 게임 | 오분쯤 느린 시계</title>
<meta name="description" content="화살표를 따라 모든 버튼을 누르고 폭탄을 해제하세요! 초등 논리력·코딩 사고력 퍼즐 게임 (무료, 로그인 없음)">
<meta property="og:title" content="폭탄 제거 작전! 초등 논리력 퍼즐 게임">
<meta property="og:description" content="화살표를 따라 모든 버튼을 누르고 폭탄을 해제하세요!">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0f172a;color:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
.wrap{width:100%;max-width:440px}
h1{margin:6px 0 2px;font-size:28px;color:#fbbf24;text-align:center}
.sub{margin:0 0 10px;font-size:13px;color:#cbd5e1;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;background:#1e293b;border:2px solid #334155;border-radius:16px;padding:10px 14px;margin-bottom:10px}
.bar small{display:block;font-size:11px;color:#94a3b8}.bar b{font-size:18px;font-weight:400}
.btn{border:0;border-radius:12px;font:inherit;cursor:pointer;color:#fff;padding:10px 14px}
.btn.rule{background:#4f46e5}.btn.reset{background:#475569;width:100%;margin-top:12px;font-size:15px}
.safe{background:#1e293b;border:4px solid #475569;border-radius:24px;padding:16px}
.safe.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.status{display:flex;justify-content:space-between;font-size:12px;background:#0f172a99;border-radius:12px;padding:8px 12px;margin-bottom:10px;color:#94a3b8}
.status em{font-style:normal;color:#fbbf24}
#grid{--s:min(24vw,96px);display:grid;gap:10px;justify-content:center;padding:10px;background:#020617b3;border-radius:16px}
.cell{width:var(--s);height:var(--s);border-radius:16px;border:2px solid #475569;background:#1e293b;color:#fbbf24;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .25s}
.cell:active{transform:scale(.92)}
.cell svg{width:30px;height:30px;fill:currentColor}
.cell span{font-size:22px;line-height:1}
.cell.bomb{background:linear-gradient(135deg,#dc2626,#9f1239);border-color:#f87171;color:#fee2e2}
.cell.open{background:linear-gradient(135deg,#059669,#166534);border-color:#34d399;color:#d1fae5}
.cell.bomb i,.cell.open i{font-style:normal;font-size:26px}
.cell.bomb small,.cell.open small{font-size:11px;background:#0006;border-radius:6px;padding:1px 6px}
.cell.done{opacity:.4}
.cell.now{opacity:1;transform:scale(1.06);box-shadow:0 0 0 4px #fbbf24,0 0 20px #eab308e6}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.show{display:flex}
.box{background:#1e293b;border:2px solid #f59e0b80;border-radius:24px;max-width:360px;width:100%;padding:22px;text-align:center}
.box h3{margin:4px 0 10px;font-size:24px;color:#fbbf24;font-weight:400}
.box p{font-size:14px;line-height:1.6;color:#e2e8f0;margin:6px 0;text-align:left;background:#0f172acc;border-radius:12px;padding:10px 12px}
.box .c{text-align:center;background:none}
.box .go{width:100%;margin-top:12px;padding:14px;background:#f59e0b;color:#0f172a;font-size:17px}
.box a{color:#67e8f9}
footer{font-size:11px;color:#64748b;text-align:center;margin-top:10px}footer a{color:#94a3b8}
</style>
</head>
<body>
<div class="wrap">
  <h1>💣 폭탄 제거 작전! 🔐</h1>
  <p class="sub">화살표가 가리키는 칸으로 이동하며 모든 버튼을 누르세요!</p>
  <div class="bar">
    <div><small>단계</small><b id="stage" style="color:#fcd34d">Stage 1</b></div>
    <div><small>점수</small><b id="score" style="color:#67e8f9">0점</b></div>
    <button class="btn rule" id="rule">❓ 규칙</button>
  </div>
  <div class="safe" id="safe">
    <div class="status"><span id="goal"></span><span>남은 칸: <em id="left">0</em>개</span></div>
    <div id="grid"></div>
    <button class="btn reset" id="reset">↻ 다시 시도</button>
  </div>
</div>

<div id="modal"><div class="box"><div id="m-icon" style="font-size:52px"></div><h3 id="m-title"></h3><div id="m-body"></div><button class="btn go" id="m-btn"></button></div></div>

<footer>오분쯤 느린 시계 어린이 창의력 개발 퍼즐 시리즈<br><a href="https://blog.naver.com/young_0620" target="_blank" rel="noopener">blog.naver.com/young_0620</a></footer>

<script>
const $=id=>document.getElementById(id);
const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]}, ROT={U:0,R:90,D:180,L:270};
// 칸 표기: 방향(U/D/L/R)+칸수, T = 폭탄/금고(도착 칸). t: B=폭탄, O=금고
const PRESETS=[
  {c:2,r:3,t:'O',g:['T','L1','D1','L1','R1','U2']},
  {c:3,r:2,t:'O',g:['R1','D1','L2','T','R1','L2']},
  {c:3,r:3,t:'B',g:['D2','L1','D1','R1','U1','L2','R1','R1','T']},
  {c:3,r:4,t:'B',g:['D3','T','D3','U1','L1','U1','R1','U2','U1','U1','U2','L1']}
];
let stage=0,score=0,L,visited=[],busy=false,run=0;

// ---- 효과음 (첫 터치 후 생성) ----
let ac;
function tone(f,t,d,type,vol,delay=0){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,n);
  o.frequency.exponentialRampToValueAtTime(t,n+d);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.01,n+d);
  o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);}catch(e){}
}
const sfx={click:()=>tone(400,800,.08,'sine',.3),step:()=>tone(520,880,.12,'triangle',.4),err:()=>tone(180,110,.25,'sawtooth',.3),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.3,'sine',.3,i*.1))};

// ---- 풀이 검증 / 랜덤 레벨 ----
function step(g,c,r,i){const d=g[i][0],k=+g[i][1],x=i%c+V[d][0]*k,y=(i/c|0)+V[d][1]*k;return(x<0||x>=c||y<0||y>=r)?-1:y*c+x}
function winners(g,c,r){const n=c*r,out=[];
  for(let s=0;s<n;s++){let i=s,seen=[];
    while(i>=0&&!seen.includes(i)){seen.push(i);if(g[i]==='T'){if(seen.length===n)out.push(s);break}i=step(g,c,r,i)}}
  return out}
function randomLevel(){
  const c=3,r=Math.random()<.5?3:4,n=c*r;let best=null;
  for(let t=0;t<200;t++){
    let cur=Math.random()*n|0;const vis=new Set([cur]),g=new Array(n);let ok=true;
    while(vis.size<n){const x=cur%c,y=cur/c|0,cand=[];
      for(const d in V)for(let k=1;k<Math.max(c,r);k++){const nx=x+V[d][0]*k,ny=y+V[d][1]*k;
        if(nx>=0&&nx<c&&ny>=0&&ny<r&&!vis.has(ny*c+nx))cand.push([ny*c+nx,d+k])}
      if(!cand.length){ok=false;break}
      const [ni,code]=cand[Math.random()*cand.length|0];g[cur]=code;cur=ni;vis.add(cur)}
    if(!ok)continue;g[cur]='T';best={c,r,t:Math.random()<.5?'B':'O',g};
    if(winners(g,c,r).length===1)break}
  return best}

// ---- 화면 ----
function modal(icon,title,body,btn,fn){
  $('m-icon').textContent=icon;$('m-title').textContent=title;$('m-body').innerHTML=body;$('m-btn').textContent=btn;
  $('m-btn').onclick=()=>{sfx.click();$('modal').classList.remove('show');fn&&fn()};$('modal').classList.add('show')}
const RULES=`<p><b>1️⃣ 화살표와 숫자</b><br>화살표는 <b>이동 방향</b>, 숫자는 <b>칸 수</b>예요. (예: ↓ 2 = 아래로 2칸)</p>
<p><b>2️⃣ 승리 조건</b><br>시작 버튼을 하나 고르면 화살표를 따라 자동으로 이동해요. <b>모든 버튼을 한 번씩</b> 지나 마지막에 폭탄제거 / OPEN 버튼에 도착하면 성공!</p>
<p><b>3️⃣ 첫 번째 버튼 찾기</b><br>어느 칸에서 시작해야 모든 칸을 들를 수 있을지 잘 생각해보세요!</p>`;

function arrow(d){return `<svg viewBox="0 0 24 24" style="transform:rotate(${ROT[d]}deg)"><path d="M12 3l8 9h-5v9h-6v-9H4z"/></svg>`}
function load(){
  run++;visited=[];busy=false;L=stage<PRESETS.length?PRESETS[stage]:randomLevel();
  $('stage').textContent='Stage '+(stage+1);$('score').textContent=score+'점';
  $('goal').innerHTML=L.t==='B'?'목표: <em>폭탄 해제</em> 버튼 누르기':'목표: <em>금고 OPEN</em> 버튼 누르기';
  const gr=$('grid');gr.style.gridTemplateColumns=`repeat(${L.c},auto)`;gr.innerHTML='';
  L.g.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';
    if(v==='T'){b.classList.add(L.t==='B'?'bomb':'open');b.innerHTML=L.t==='B'?'<i>💣</i><small>폭탄제거</small>':'<i>🔐</i><small>OPEN</small>'}
    else b.innerHTML=arrow(v[0])+`<span>${v[1]}</span>`;
    b.onclick=()=>{if(!busy&&!visited.length){sfx.click();go(i)}};gr.appendChild(b)});
  paint()}
function paint(){[...$('grid').children].forEach((b,i)=>{b.classList.toggle('done',visited.includes(i));b.classList.toggle('now',i===visited[visited.length-1])});
  $('left').textContent=L.c*L.r-visited.length}
function fail(msg){busy=true;sfx.err();$('safe').classList.add('shake');setTimeout(()=>$('safe').classList.remove('shake'),500);
  setTimeout(()=>modal('⚠️','앗, 실패!',`<p class="c">${msg}</p><p class="c">시작 버튼을 다시 골라보세요!</p>`,'다시 시도',load2),350)}
function load2(){run++;visited=[];busy=false;paint()}
function go(i){
  visited.push(i);sfx.step();paint();busy=true;
  if(L.g[i]==='T'){
    if(visited.length===L.c*L.r){sfx.win();const e=100+stage*20;score+=e;
      setTimeout(()=>{$('score').textContent=score+'점';
        modal('🎉','미션 성공!',`<p class="c">모든 버튼을 누르고 안전하게 해제했어요!<br><b style="color:#67e8f9;font-size:22px">+${e}점</b></p><p class="c">더 많은 퍼즐 · 학습자료<br><a href="https://blog.naver.com/young_0620" target="_blank" rel="noopener">오분쯤 느린 시계 블로그</a></p>`,'다음 단계 도전하기 ➡️',()=>{stage++;load()})},450)}
    else fail('모든 버튼을 누르지 못하고 도착했어요!');return}
  const n=step(L.g,L.c,L.r,i);
  if(n<0)return fail('화살표가 바깥을 가리켜서 더 갈 수 없어요!');
  if(visited.includes(n))return fail('이미 눌렀던 버튼으로 돌아왔어요!');
  const tk=run;setTimeout(()=>{if(tk===run)go(n)},550)}

$('reset').onclick=()=>{sfx.click();load2()};
$('rule').onclick=()=>{sfx.click();modal('🎓','퍼즐 규칙',RULES,'알겠어요! 게임 시작하기')};
load();modal('🎓','퍼즐 규칙',RULES,'알겠어요! 게임 시작하기');
</script>
</body>
</html>
